openapi: 3.1.0
info:
  title: Cisco Catalyst Center (DNA Center) Intent API
  description: |
    The Cisco Catalyst Center (formerly DNA Center) Intent API provides
    programmatic management of Cisco enterprise network hardware, including
    discovery, inventory, provisioning, assurance, software image
    management, sites, and command runner. Authentication uses a basic-auth
    token exchange against /dna/system/api/v1/auth/token; the returned
    token is sent on subsequent requests as the X-Auth-Token header.
  version: "1.0.0"
  contact:
    name: Cisco DevNet
    url: https://developer.cisco.com/docs/dna-center/
servers:
  - url: https://{controllerHost}
    variables:
      controllerHost:
        default: sandboxdnac.cisco.com
        description: Host of the Catalyst Center controller
security:
  - tokenAuth: []
tags:
  - name: Authentication
  - name: Devices
  - name: Sites
  - name: Network
  - name: Discovery
  - name: CommandRunner
  - name: Topology
paths:
  /dna/system/api/v1/auth/token:
    post:
      tags: [Authentication]
      summary: Obtain an access token (valid for 1 hour)
      operationId: authenticate
      security:
        - basicAuth: []
      responses:
        "200":
          description: Authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  Token: { type: string }
        "401":
          description: Invalid credentials
  /dna/intent/api/v1/network-device:
    get:
      tags: [Devices]
      summary: Get device list
      operationId: getDeviceList
      parameters:
        - in: query
          name: hostname
          schema:
            type: array
            items: { type: string }
        - in: query
          name: managementIpAddress
          schema:
            type: array
            items: { type: string }
        - in: query
          name: macAddress
          schema:
            type: array
            items: { type: string }
        - in: query
          name: family
          schema:
            type: array
            items: { type: string }
        - in: query
          name: serialNumber
          schema:
            type: array
            items: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: offset
          schema: { type: integer }
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
                  version: { type: string }
    post:
      tags: [Devices]
      summary: Add a device
      operationId: addDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ipAddress:
                  type: array
                  items: { type: string }
                snmpVersion: { type: string }
                snmpROCommunity: { type: string }
                snmpRWCommunity: { type: string }
                cliTransport: { type: string }
                userName: { type: string }
                password: { type: string }
                enablePassword: { type: string }
      responses:
        "202":
          description: Task accepted
  /dna/intent/api/v1/network-device/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Devices]
      summary: Get device by id
      operationId: getDeviceById
      responses:
        "200":
          description: A device
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: { $ref: "#/components/schemas/Device" }
    delete:
      tags: [Devices]
      summary: Delete device by id
      operationId: deleteDeviceById
      responses:
        "202":
          description: Task accepted
  /dna/intent/api/v1/network-device/count:
    get:
      tags: [Devices]
      summary: Get device count
      operationId: getDeviceCount
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  response: { type: integer }
                  version: { type: string }
  /dna/intent/api/v1/site:
    get:
      tags: [Sites]
      summary: Get site
      operationId: getSite
      parameters:
        - in: query
          name: name
          schema: { type: string }
        - in: query
          name: siteId
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [area, building, floor] }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: offset
          schema: { type: integer }
      responses:
        "200":
          description: Sites
    post:
      tags: [Sites]
      summary: Create site
      operationId: createSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [area, building, floor]
                site:
                  type: object
      responses:
        "202":
          description: Task accepted
  /dna/intent/api/v1/discovery:
    post:
      tags: [Discovery]
      summary: Start a discovery
      operationId: startDiscovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                discoveryType: { type: string }
                ipAddressList: { type: string }
                cdpLevel: { type: integer }
                lldpLevel: { type: integer }
                preferredMgmtIPMethod: { type: string }
                protocolOrder: { type: string }
                retry: { type: integer }
                timeout: { type: integer }
      responses:
        "202":
          description: Task accepted
    get:
      tags: [Discovery]
      summary: Get discoveries by range
      operationId: getDiscoveriesByRange
      parameters:
        - in: query
          name: startIndex
          schema: { type: integer }
        - in: query
          name: recordsToReturn
          schema: { type: integer }
      responses:
        "200":
          description: Discoveries
  /dna/intent/api/v1/network-device-poller/cli/read-request:
    post:
      tags: [CommandRunner]
      summary: Run a read-only CLI command against devices
      operationId: runCliCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commands:
                  type: array
                  items: { type: string }
                deviceUuids:
                  type: array
                  items: { type: string }
                description: { type: string }
                name: { type: string }
                timeout: { type: integer }
      responses:
        "202":
          description: Task accepted
  /dna/intent/api/v1/topology/physical-topology:
    get:
      tags: [Topology]
      summary: Get physical topology
      operationId: getPhysicalTopology
      parameters:
        - in: query
          name: nodeType
          schema: { type: string }
      responses:
        "200":
          description: Physical topology
  /dna/intent/api/v1/network:
    get:
      tags: [Network]
      summary: Get network settings
      operationId: getNetwork
      parameters:
        - in: query
          name: siteId
          schema: { type: string }
      responses:
        "200":
          description: Network settings
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    tokenAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
  schemas:
    Device:
      type: object
      properties:
        id: { type: string }
        hostname: { type: string }
        managementIpAddress: { type: string }
        macAddress: { type: string }
        platformId: { type: string }
        family: { type: string }
        type: { type: string }
        series: { type: string }
        softwareType: { type: string }
        softwareVersion: { type: string }
        serialNumber: { type: string }
        upTime: { type: string }
        lastUpdateTime: { type: integer }
        location: { type: string }
        reachabilityStatus: { type: string }
        role: { type: string }
        snmpContact: { type: string }
        snmpLocation: { type: string }
